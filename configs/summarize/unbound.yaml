# matcha summarize — bootstrap comparison for unbound group
# Each immediate subdirectory of root_dir (one per architecture) is treated as one run.
# n_bootstrap=1000 in the eval configs produces "{split_idx}_{bootstrap_idx}" keys,
# so statistical_test must be "bootstrap" (bootstrap percentile CIs + Holm-Bonferroni).
root_dir: "eval/unbound"
output_path: "summarize/unbound"
statistical_test: "bootstrap"
