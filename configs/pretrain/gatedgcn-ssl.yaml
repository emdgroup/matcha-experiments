dataset:
  task_type: graph
  train_smiles: datasets/b3lyp/train/smiles.parquet
  val_smiles: datasets/b3lyp/val/smiles.parquet
  train_y_graph: datasets/b3lyp/train/graph_y.npz
  val_y_graph: datasets/b3lyp/val/graph_y.npz
  train_y_node: datasets/b3lyp/train/node_y.npz
  val_y_node: datasets/b3lyp/val/node_y.npz
model:
  architecture: GatedGCNPretraining
  params:
    num_node_targets: 6
    num_graph_targets: 19
    enc_num_layers: 6
    enc_node_encoder_depth: 4
    enc_atom_hidden_dim: 1024
    enc_atom_input_dim: 73
    enc_bond_input_dim: 15
    enc_jk: last
    enc_activation: swish
    enc_dropout: 0.1
    node_head_dims: null
    node_task_head_dims:
    - 256
    - 256
    graph_head_dims: null
    graph_task_head_dims:
    - 256
    - 256
    pred_activation: swish
    pred_dropout: 0.4
    loss_fn: mae
    loss_args: {}
    node_loss_weight: 0.9
    graph_loss_weight: 0.1
    optimizer: adamw
    optimizer_args:
      lr: 1.0e-05
      weight_decay: 0.001
    scheduler: warmup_cosine_annealing
    scheduler_args:
      total_steps: 273046
      peak_lr_factor: 30.0
      warmup_ratio: 0.02
      min_lr: 0.0001
    per_task_log_every_n_steps: 100
  datamodule:
    laplacian_k: 0
    rwse_k: 0
    elstatic_k: 0
    distmat_k: 0
    rrwp_k: 0
    compute_distances: false
    num_virtual_nodes: 1
    batch_size: 512
    num_workers: 0
    augment_resonance: false
    scale_y_graph: true
  training:
    num_epochs: 2
    early_stopping: false
    patience: 10
    accelerator: gpu
    devices: 1
    seed: 42
pipe:
  visible_devices: null
  strategy:
    timeout_seconds: 7200
    find_unused_parameters: false
  dataloader_num_workers: 8
  fit_datamodule_size: 1000000
  gradient_accumulation_steps: 1
  gradient_clip_val: 1.0
output:
  serialization: pretrain/b3lyp/gatedgcn
  mlflow:
    experiment_name: b3lyp
    tags: {}
    log_dir: mlflow
    run_name: gatedgcn
    server_uri: null
magic: null
