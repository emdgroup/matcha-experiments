dataset:
  path: datasets/openadmet/train_unbound.csv
  smiles_key: SMILES
  label_key:
    - MPPB_endpoint
    - MBPB_endpoint
    - MGMB_endpoint
  operator_key:
    - OPERATOR_1
    - OPERATOR_2
    - OPERATOR_3

split:
  method: file
  n_subset: 1
  n_bootstrap: 1000
  frac_bootstrap: 1.0
  method_params:
    path:
      - datasets/openadmet/test_unbound.csv

model:
  architecture: ChempropRegressor
  config_path: results/optima/unbound/chemprop.yaml
  params:
    loss_fn: bounded-mse
    num_endpoints: 3
    num_epochs: 100
    batch_size: 64
    label_encoder_params:
      0: {task_label: MPPB_endpoint}
      1: {task_label: MBPB_endpoint}
      2: {task_label: MGMB_endpoint}

output:
  serialization:
    path: results/evaluate/unbound/chemprop
