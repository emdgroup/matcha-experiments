# Note: GT3DRegressor requires 3D conformers. Update dataset.path to an SDF
# file with pre-computed conformers if MATCHA does not generate them on-the-fly.
dataset:
  path: datasets/openadmet/train_clint.csv
  smiles_key: SMILES
  label_key:
    - HLM_CLint_endpoint
    - MLM_CLint_endpoint
  operator_key:
    - OPERATOR_1
    - OPERATOR_2

split:
  method: time
  n_subset: 3
  method_params:
    key: mol_id
    split_size: 0.1

model:
  architecture: GT3DRegressor
  params:
    loss_fn: bounded-mse
    num_endpoints: 2
    num_epochs: 50
    batch_size: 64
    label_encoder_params:
      0: {task_label: HLM_CLint_endpoint}
      1: {task_label: MLM_CLint_endpoint}

tuning:
  architecture_search:
    config: default
    budget: 100
  optimizer_search:
    config: default
    budget: 50

output:
  optimum:
    path: results/optima/clint
    filename: gt3d
